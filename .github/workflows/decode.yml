name: DDLC Decoding Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Decompilers & Dependencies
        run: |
          pip install unrpyc rpatool pillow

      - name: Run Decoding Operations
        run: |
          mkdir -p output/
          
          # Process monika.chr if present
          if [ -f "Charecters/monika.chr" ]; then
            cp Charecters/monika.chr output/monika.png
          else
            echo "monika.chr not found, creating placeholder..."
            echo "Run complete" > output/status.txt
          fi

      - name: Commit Output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: decoded game files"
          
