name: DDLC Decoding Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pillow pycryptodome

      - name: Process Character Files
        run: |
          mkdir -p output
          
          # Check for monika.chr in Charecters directory
          if [ -f "Charecters/monika.chr" ]; then
            cp Charecters/monika.chr output/monika.png
            echo "Successfully converted monika.chr to monika.png"
          else
            echo "Execution timestamp: $(date)" > output/status.txt
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff-index --quiet HEAD || git commit -m "auto: process game files"
          git push
          
