name: DDLC Decoding Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pillow pycryptodome

      - name: Process Character Files
        run: |
          # Create folder with space handling
          mkdir -p "Decoded Results"
          
          # 1. Monika (PNG Image Disguise)
          if [ -f "Charecters/monika.chr" ]; then
            cp "Charecters/monika.chr" "Decoded Results/monika.png"
            echo "Decoded monika.chr -> monika.png"
          fi

          # 2. Yuri (Base64 Encoded Text)
          if [ -f "Charecters/yuri.chr" ]; then
            python3 -c "
          import base64
          try:
              with open('Charecters/yuri.chr', 'r', encoding='utf-8') as f:
                  encoded = f.read().strip()
              decoded = base64.b64decode(encoded).decode('utf-8')
              with open('Decoded Results/yuri_decoded.txt', 'w', encoding='utf-8') as out:
                  out.write(decoded)
              print('Decoded yuri.chr -> yuri_decoded.txt')
          except Exception as e:
              print(f'Error processing yuri.chr: {e}')
          "
          fi

          # 3. Sayori (Audio File - Convert extension to .ogg for spectrogram analysis)
          if [ -f "Charecters/sayori.chr" ]; then
            cp "Charecters/sayori.chr" "Decoded Results/sayori_audio.ogg"
            echo "Prepared sayori.chr -> sayori_audio.ogg"
          fi

          # 4. Natsuki (Raw Image Texture Data)
          if [ -f "Charecters/natsuki.chr" ]; then
            cp "Charecters/natsuki.chr" "Decoded Results/natsuki_raw.png"
            echo "Prepared natsuki.chr -> natsuki_raw.png"
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Decoded Results/"
          git diff-index --quiet HEAD || git commit -m "auto: decode character files into Decoded Results"
          git push
          
